<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Activity Tracker</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <script>
    // The last theme (mirrored by app.tsx) before the first paint, so the page does not flash while IndexedDB loads.
    // Not in the demo (?demo): it follows the system, like the defaults in tokens.css.
    if (!/[?&]demo\b/.test(location.search)) try {
      var themes = JSON.parse(localStorage.getItem('theme-vars'));
      var vars = themes && (themes.fixed || (matchMedia('(prefers-color-scheme: dark)').matches ? themes.dark : themes.light));
      for (var k in vars) document.documentElement.style.setProperty(k, vars[k]);
    } catch (e) {}
  </script>
  <script type="module" src="/src/app.tsx"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
